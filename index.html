const KEY='asmImportantMessages';let level='IMPORTANT',currentBlob=null,currentData=null,history=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);function setLevel(b){level=b.dataset.level;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('on',x===b))}function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='history')renderHistory()}function updateClock(){const n=new Date(),p=v=>String(v).padStart(2,'0');$('clockH').textContent=p(n.getHours());$('clockM').textContent=p(n.getMinutes());$('clockS').textContent=p(n.getSeconds());$('clockDate').textContent=n.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function wrap(ctx,text,max){const words=String(text).split(/\s+/),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>max&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function generateMessage(){const recipient=$('recipient').value.trim()||'À L’ATTENTION DE TOUS',subject=$('subject').value.trim()||'INFORMATION IMPORTANTE',message=$('message').value.trim();if(!message){toast('RÉDIGEZ VOTRE MESSAGE');return}const now=new Date(),data={id:Date.now(),level,recipient,subject,message,date:now.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase(),time:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};currentData=data;drawImage(data).then(blob=>{currentBlob=blob;const url=URL.createObjectURL(blob);$('previewImage').src=url;$('previewEmpty').style.display='none';$('previewReady').style.display='block';history.unshift(data);history=history.slice(0,50);localStorage.setItem(KEY,JSON.stringify(history));go('preview');toast('IMAGE PREMIUM GÉNÉRÉE')})}
function drawImage(d){return new Promise(resolve=>{const c=$('canvas'),x=c.getContext('2d'),urgent=d.level==='URGENT',lux='Palatino, "Palatino Linotype", "Book Antiqua", serif',clockFont='"Avenir Next Condensed", "Arial Narrow", sans-serif';const bg=x.createLinearGradient(0,0,1080,1350);bg.addColorStop(0,urgent?'#4b0b13':'#132f43');bg.addColorStop(.38,'#090c10');bg.addColorStop(1,'#010203');x.fillStyle=bg;x.fillRect(0,0,1080,1350);x.strokeStyle=urgent?'#ff5360':'#e3bd63';x.lineWidth=9;x.strokeRect(27,27,1026,1296);x.strokeStyle='#ffffff18';x.lineWidth=2;x.strokeRect(45,45,990,1260);x.textAlign='center';x.fillStyle='#f2d276';x.font='900 78px '+lux;x.fillText('⚜',540,108);x.font='900 29px '+lux;x.fillText('ASM TECHNOLOGIES',540,151);const title='MESSAGE';x.fillStyle=urgent?'#ff6671':'#fff';x.font='900 70px '+lux;x.fillText(title,540,224);const stampText=d.level==='CONFIDENTIEL'?'CONFIDENTIEL':d.level==='URGENT'?'URGENT':'IMPORTANT',stampColor=d.level==='URGENT'?'#ff5360':d.level==='CONFIDENTIEL'?'#ef5965':'#e4be62',stampWidth=d.level==='CONFIDENTIEL'?430:410;x.save();x.translate(540,285);x.rotate(-.025);x.strokeStyle=stampColor;x.lineWidth=6;x.strokeRect(-stampWidth/2,-35,stampWidth,70);x.strokeStyle=stampColor+'99';x.lineWidth=2;x.strokeRect(-stampWidth/2+9,-26,stampWidth-18,52);x.fillStyle=stampColor;x.font='900 '+(d.level==='CONFIDENTIEL'?34:42)+'px Copperplate, '+lux;x.fillText(stampText,0,12);x.restore();x.fillStyle='#e0c77e';x.font='800 23px Copperplate, '+lux;x.fillText(d.date,540,352);const parts=String(d.time||'00:00:00').split(':'),clock=[parts[0]||'00',parts[1]||'00',parts[2]||'00'],start=265;clock.forEach((v,i)=>{const cx=start+i*201;x.fillStyle='#17191c';x.strokeStyle=urgent?'#a8333e':'#8b7135';x.lineWidth=3;x.beginPath();x.roundRect(cx,372,148,78,12);x.fill();x.stroke();x.fillStyle='#020304';x.fillRect(cx+2,410,144,2);x.fillStyle='#fff';x.font='900 50px '+clockFont;x.fillText(v,cx+74,430);if(i<2){x.fillStyle='#dfc36d';x.font='900 35px '+clockFont;x.fillText(':',cx+174,425)}});function panel(y,h,label,value,big=false){x.fillStyle='#050709dd';x.strokeStyle=urgent?'#8f2732':'#5c5032';x.lineWidth=2;x.beginPath();x.roundRect(70,y,940,h,18);x.fill();x.stroke();x.textAlign='left';x.fillStyle=urgent?'#ff8a93':'#bda76f';x.font='800 19px Copperplate, '+lux;x.fillText(label,98,y+34);x.fillStyle='#fff';x.font=big?'800 35px '+lux:'800 30px '+lux;const lines=wrap(x,value,880).slice(0,big?7:2),lineH=big?45:37;lines.forEach((line,i)=>x.fillText(line,98,y+79+i*lineH))}panel(478,110,'DESTINATAIRE',d.recipient);panel(606,110,'OBJET',d.subject);panel(734,350,'MESSAGE',d.message,true);x.textAlign='center';x.fillStyle='#e8c96f';x.font='900 31px '+lux;x.fillText('AZIEZ SAMI MOURAD',540,1173);x.fillStyle='#e4be62';x.font='900 32px '+lux;x.fillText('⚜',540,1275);c.toBlob(resolve,'image/png',1)})}
function shareImage(){if(!currentBlob){toast('GÉNÉREZ D’ABORD UNE IMAGE');return}const file=new File([currentBlob],'MESSAGE_IMPORTANT_'+currentData.id+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){navigator.share({files:[file]}).catch(e=>{if(e.name!=='AbortError')toast('RÉESSAYEZ LE PARTAGE')});return}downloadImage();toast('IMAGE ENREGISTRÉE — PARTAGEZ-LA DEPUIS PHOTOS')}function downloadImage(){if(!currentBlob){toast('AUCUNE IMAGE');return}const a=document.createElement('a'),url=URL.createObjectURL(currentBlob);a.href=url;a.download='MESSAGE_IMPORTANT_'+currentData.id+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function renderHistory(){$('historyList').innerHTML=history.map(m=>`<div class="item"><b>${m.level} · ${m.subject}</b><small>${m.recipient} · ${m.date} ${m.time}</small><div class="item-actions"><button class="item-view" onclick="viewMessage(${m.id})">VOIR LE MESSAGE</button><button class="item-delete" aria-label="Supprimer ce message" onclick="deleteMessage(${m.id})">×</button></div></div>`).join('')||'<div class="card sub" style="text-align:center">AUCUN MESSAGE ENREGISTRÉ</div>'}function viewMessage(id){const data=history.find(m=>m.id===id);if(!data){toast('MESSAGE INTROUVABLE');return}currentData=data;drawImage(data).then(blob=>{currentBlob=blob;const old=$('previewImage').src;if(old&&old.startsWith('blob:'))URL.revokeObjectURL(old);$('previewImage').src=URL.createObjectURL(blob);$('previewEmpty').style.display='none';$('previewReady').style.display='block';go('preview');toast('MESSAGE OUVERT')})}function deleteMessage(id){history=history.filter(m=>m.id!==id);localStorage.setItem(KEY,JSON.stringify(history));renderHistory();toast('MESSAGE SUPPRIMÉ')}function clearHistory(){history=[];localStorage.setItem(KEY,'[]');renderHistory();toast('HISTORIQUE EFFACÉ')}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=11',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});updateClock();setInterval(updateClock,1000);renderHistory();

const RMS_KEY='asmRmsCards';let rmsCards=JSON.parse(localStorage.getItem(RMS_KEY)||'[]'),currentRmsBlob=null,currentRmsData=null;const rmsLogo=new Image();rmsLogo.src='rms-logo.jpg';function normaliseRms(d){if(!d.createdAt)d.createdAt=Number(d.id)||Date.now();if(!d.expiresAt){const e=new Date(d.createdAt);e.setMonth(e.getMonth()+3);d.expiresAt=e.getTime()}return d}rmsCards=rmsCards.map(normaliseRms);localStorage.setItem(RMS_KEY,JSON.stringify(rmsCards));function rmsRemaining(d){normaliseRms(d);const ms=d.expiresAt-Date.now();if(ms<=0)return{expired:true,text:'CARTE EXPIRÉE',short:'EXPIRÉE'};const days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000);return{expired:false,text:`EXPIRE DANS ${days} J ${hours} H ${mins} MIN`,short:`${days} J ${hours} H ${mins} MIN`}}function rmsExpiryDate(d){return new Date(normaliseRms(d).expiresAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase()}
function loadRmsLogo(){return rmsLogo.complete?Promise.resolve():new Promise((resolve,reject)=>{rmsLogo.onload=resolve;rmsLogo.onerror=reject})}
function drawRmsCard(d){d=normaliseRms(d);const remaining=rmsRemaining(d);return loadRmsLogo().then(()=>new Promise(resolve=>{const c=$('canvas'),x=c.getContext('2d'),lux='Palatino, "Palatino Linotype", serif',tech='"Avenir Next Condensed", "Arial Narrow", sans-serif',g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#07364b');g.addColorStop(.42,'#031521');g.addColorStop(1,'#010407');x.fillStyle=g;x.fillRect(0,0,1080,1350);x.strokeStyle='#25dadd';x.lineWidth=8;x.strokeRect(28,28,1024,1294);x.strokeStyle='#dabb66';x.lineWidth=2;x.strokeRect(47,47,986,1256);x.shadowColor='#19dbe0';x.shadowBlur=35;x.drawImage(rmsLogo,420,82,240,240);x.shadowBlur=0;x.textAlign='center';x.fillStyle='#fff';x.font='900 62px '+lux;x.fillText('CARTE D’ACCÈS',540,403);x.fillStyle='#36e0e1';x.font='900 35px Copperplate, '+lux;x.fillText('RMS CLOUD',540,455);function box(y,label,value){x.fillStyle='#020a10e8';x.strokeStyle='#1b8992';x.lineWidth=3;x.beginPath();x.roundRect(90,y,900,170,20);x.fill();x.stroke();x.textAlign='left';x.fillStyle='#d7bd71';x.font='900 23px Copperplate, '+lux;x.fillText(label,125,y+48);x.fillStyle='#fff';x.font='800 45px '+tech;const lines=wrap(x,value,820).slice(0,2);lines.forEach((line,i)=>x.fillText(line,125,y+112+i*48))}box(515,'IDENTIFIANT',d.user);box(720,'MOT DE PASSE',d.password);x.textAlign='center';x.fillStyle='#91aeb7';x.font='700 24px '+lux;x.fillText('CRÉÉE LE '+d.date+'  ·  '+d.time,540,955);x.fillStyle='#d7bd71';x.font='900 24px Copperplate, '+lux;x.fillText('VALABLE JUSQU’AU '+rmsExpiryDate(d),540,1002);x.fillStyle=remaining.expired?'#ff6671':'#36e0e1';x.font='900 27px '+tech;x.fillText(remaining.text,540,1048);x.fillStyle='#e9cd78';x.font='900 34px '+lux;x.fillText('AZIEZ SAMI MOURAD',540,1132);x.fillStyle='#27d9dc';x.font='900 27px Copperplate, '+lux;x.fillText('ASM TECHNOLOGIES',540,1184);x.fillStyle='#e4be62';x.font='900 44px '+lux;x.fillText('⚜',540,1250);c.toBlob(resolve,'image/png',1)}))}
function generateRmsCard(){const user=$('rmsUser').value.trim(),password=$('rmsPassword').value.trim();if(!user||!password){toast('IDENTIFIANT ET MOT DE PASSE REQUIS');return}const n=new Date();const d={id:Date.now(),createdAt:n.getTime(),user,password,date:n.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase(),time:n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};drawRmsCard(d).then(blob=>{currentRmsData=d;currentRmsBlob=blob;showRmsPreview(blob);rmsCards.unshift(d);rmsCards=rmsCards.slice(0,30);localStorage.setItem(RMS_KEY,JSON.stringify(rmsCards));renderRmsCards();toast('CARTE RMS VALABLE 3 MOIS')}).catch(()=>toast('LOGO RMS INDISPONIBLE'))}
function showRmsPreview(blob){const img=$('rmsPreviewImage'),old=img.src;if(old&&old.startsWith('blob:'))URL.revokeObjectURL(old);img.src=URL.createObjectURL(blob);$('rmsPreview').style.display='block'}
function openRmsCard(id){const d=rmsCards.find(x=>x.id===id);if(!d)return;drawRmsCard(d).then(blob=>{currentRmsData=d;currentRmsBlob=blob;$('rmsUser').value=d.user;$('rmsPassword').value=d.password;showRmsPreview(blob);$('rms').scrollTo({top:0,behavior:'smooth'});toast('CARTE RMS OUVERTE')})}
function deleteRmsCard(id){rmsCards=rmsCards.filter(x=>x.id!==id);localStorage.setItem(RMS_KEY,JSON.stringify(rmsCards));renderRmsCards();toast('CARTE RMS SUPPRIMÉE')}
function renderRmsCards(){const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('rmsList').innerHTML=rmsCards.map(d=>{const left=rmsRemaining(d);return`<div class="rms-entry"><b>${esc(d.user)}</b><small>${esc(d.date)} · VALABLE JUSQU’AU ${esc(rmsExpiryDate(d))} · MOT DE PASSE ••••••••</small><div class="rms-countdown${left.expired?' expired':''}">${esc(left.text)}</div><div class="rms-entry-actions"><button class="rms-open" onclick="openRmsCard(${d.id})">VOIR LA CARTE</button><button class="rms-remove" onclick="deleteRmsCard(${d.id})">SUPPRIMER</button></div></div>`}).join('')||'<div class="card sub" style="text-align:center">AUCUNE CARTE RMS ENREGISTRÉE</div>'}
function rmsFile(){return currentRmsBlob&&new File([currentRmsBlob],'CARTE_RMS_'+currentRmsData.id+'.png',{type:'image/png'})}
function shareRmsCard(){const file=rmsFile();if(!file){toast('GÉNÉREZ D’ABORD UNE CARTE');return}if(navigator.share&&navigator.canShare?.({files:[file]})){navigator.share({files:[file]}).catch(e=>{if(e.name!=='AbortError')toast('RÉESSAYEZ LE PARTAGE')});return}downloadRmsCard();toast('CARTE ENREGISTRÉE — PARTAGEZ-LA DEPUIS PHOTOS')}
function downloadRmsCard(){const file=rmsFile();if(!file){toast('AUCUNE CARTE RMS');return}const a=document.createElement('a'),url=URL.createObjectURL(file);a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}renderRmsCards();setInterval(renderRmsCards,60000);
